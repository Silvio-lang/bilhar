<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bilhar Remoto - Multiplayer</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body {
            background-color: #1a1a1a; color: #ffffff; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; user-select: none;
        }
        #placar-container {
            display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 800px; margin-bottom: 8px;
        }
        #placar { display: flex; justify-content: space-between; width: 100%; padding: 0 10px; font-size: 20px; font-weight: bold; }
        
        #painel-controle {
            display: flex; align-items: center; gap: 12px; margin-top: 6px;
        }
        #turno-indicador {
            font-size: 16px; padding: 4px 12px; border-radius: 20px;
            background-color: #333; color: #ffeb3b; font-weight: bold;
        }
        #btn-reiniciar {
            background-color: #d32f2f; color: white; border: none;
            padding: 6px 14px; font-size: 14px; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        #btn-reiniciar:active { background-color: #9a0007; transform: scale(0.95); }

        #btn-disparar {
            background-color: #2e7d32; color: #ffffff; border: 2px solid #4caf50;
            padding: 8px 24px; font-size: 18px; font-weight: bold;
            border-radius: 8px; cursor: pointer; display: none; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,255,0,0.3);
        }
        #btn-disparar:active { background-color: #1b5e20; transform: scale(0.95); }

        .j1 { color: #4fc3f7; } .j2 { color: #ff8a65; }
        #mesa-wrapper { position: relative; }
        canvas {
            border: 8px solid #5c3a21; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            background-color: #0b6623; cursor: crosshair; max-width: 100vw; max-height: 80vh;
        }
        #mensagem {
            position: absolute; font-size: 24px; font-weight: bold; color: #ffeb3b;
            text-shadow: 2px 2px 4px #000000; display: block; text-align: center;
            background: rgba(0, 0, 0, 0.85); padding: 15px 30px; border-radius: 10px;
            top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="placar-container">
        <div id="placar">
            <div class="j1">J1 (Azul): <span id="ptsJ1">0</span></div>
            <div class="j2">J2 (Laranja): <span id="ptsJ2">0</span></div>
        </div>
        <div id="painel-controle">
            <div id="turno-indicador">Aguardando Conexão...</div>
            <button id="btn-disparar" onclick="confirmarEExecutarTacada()">JÁ!</button>
            <button id="btn-reiniciar" onclick="reiniciarPartida()">Reiniciar Jogo</button>
        </div>
    </div>

    <div id="mesa-wrapper">
        <div id="mensagem">Conectando ao servidor...</div>
        <canvas id="mesa" width="800" height="450"></canvas>
    </div>

    <!-- Chamada para a lógica do jogo -->
    <script src="script.js"></script>
</body>
</html>
